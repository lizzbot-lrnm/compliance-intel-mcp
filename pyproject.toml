[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-intel-mcp"
version = "1.0.0"
description = "Deterministic UK & US Sanctions, Corporate/Charity Registry, DNS/DMARC Security Posture, and Regulatory Recall Screening (Apify Actor + x402 MCP Server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "apify>=2.0.0,<5.0.0",
    "mcp>=1.27.0,<3.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
